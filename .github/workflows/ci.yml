name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SDK_VERSION: "3.5.2"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache dpm SDK
        uses: actions/cache@v4
        with:
          path: ~/.dpm/cache
          key: dpm-${{ runner.os }}-${{ env.SDK_VERSION }}

      - name: Install dpm
        run: |
          curl -sSL https://get.digitalasset.com/install/install.sh | sh
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Install SDK
        run: dpm install "$SDK_VERSION"

      - name: Build all packages
        run: dpm build --all

      - name: Run Daml Script tests
        working-directory: test
        run: dpm test

      - name: Upload DARs
        uses: actions/upload-artifact@v4
        with:
          name: dars
          path: |
            api/.daml/dist/*.dar
            reference/.daml/dist/*.dar
